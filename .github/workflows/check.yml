name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Repository consistency
        run: python scripts/check_repo.py
      - name: Contract manifest
        run: python scripts/contract_manifest.py check
      - name: Example spec
        run: python scripts/validate_spec.py examples/expense-app-autocat/spec.yaml
      - name: Example questionnaire
        run: python scripts/check_render.py examples/expense-app-autocat/03-questionnaire.md --spec examples/expense-app-autocat/spec.yaml
      - name: Script tests
        run: python -m unittest discover -s tests -v
      - name: English product renders
        run: |
          python scripts/render_markdown.py examples/expense-app-autocat/spec.yaml --product survey-en-minimal -o /tmp/en.md
          python scripts/check_render.py /tmp/en.md --spec examples/expense-app-autocat/spec.yaml --product survey-en-minimal
